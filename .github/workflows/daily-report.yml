name: Generate Daily Report

on:
  schedule:
    - cron: "15 13 * * 1-5"
    - cron: "59 14 * * 1-5"
    - cron: "15 17 * * 1-5"
    - cron: "59 18 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: Optional report date (YYYY-MM-DD); blank uses today
        type: string
        required: false
      force:
        description: "Generate even if today's report already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: "finance-publication"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPORT_TIMEZONE: ${{ vars.REPORT_TIMEZONE || 'America/Los_Angeles' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decide whether generation is needed
        id: gate
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.date || '' }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          SCHEDULE_EXPR: ${{ github.event.schedule || '' }}
        run: |
          set -euo pipefail
          report_date="${REQUESTED_DATE:-$(TZ="$REPORT_TIMEZONE" date +%F)}"
          report_html="daily-finance/${report_date}.html"
          report_md="daily-finance/${report_date}.md"
          report_json="daily-finance/${report_date}.snapshots.json"
          local_hour="$(TZ="$REPORT_TIMEZONE" date +%H)"
          expected_slot=""
          case "$SCHEDULE_EXPR" in
            "59 14 * * 1-5") expected_slot="07:59" ;;
            "15 17 * * 1-5") expected_slot="09:55" ;;
            "59 18 * * 1-5") expected_slot="11:59" ;;
          esac
          case "$expected_slot:$local_hour" in
            :07) expected_slot="07:59" ;;
            :10) expected_slot="09:55" ;;
            :11|:12) expected_slot="11:59" ;;
          esac

          echo "report_date=${report_date}" >> "$GITHUB_OUTPUT"
          echo "report_html=${report_html}" >> "$GITHUB_OUTPUT"
          echo "report_md=${report_md}" >> "$GITHUB_OUTPUT"
          echo "report_json=${report_json}" >> "$GITHUB_OUTPUT"
          echo "expected_slot=${expected_slot}" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_RUN" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Forcing generation for ${report_date}."
            exit 0
          fi

          if [ -f "$report_html" ] && [ -f "$report_md" ] && [ -f "$report_json" ] && [ -z "$expected_slot" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Report for ${report_date} already exists in the repo. Skipping generation."
          elif [ -f "$report_html" ] && [ -f "$report_md" ] && [ -f "$report_json" ] && python - "$report_json" "$expected_slot" <<'PY'
          import json
          import sys

          path, expected_slot = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as handle:
              document = json.load(handle)
          slots = {snapshot.get("slot") for snapshot in document.get("snapshots", [])}
          raise SystemExit(0 if expected_slot in slots else 1)
          PY
          then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot ${expected_slot} for ${report_date} already exists. Skipping generation."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            if [ -n "$expected_slot" ]; then
              echo "Snapshot ${expected_slot} for ${report_date} is missing. Generating backup snapshot now."
            else
              echo "Report for ${report_date} is missing. Generating now."
            fi
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate, validate and publish
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          REPORT_DATE: ${{ steps.gate.outputs.report_date }}
          REPORT_FORCE_GENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          REPORT_SNAPSHOT_SLOT: ${{ steps.gate.outputs.expected_slot }}
          REPORT_NEWS_LIMIT: ${{ vars.REPORT_NEWS_LIMIT || '12' }}
          REPORT_STOCK_LIMIT: ${{ vars.REPORT_STOCK_LIMIT || '15' }}
          REPORT_WATCHLIST: ${{ vars.REPORT_WATCHLIST || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish-report.py
